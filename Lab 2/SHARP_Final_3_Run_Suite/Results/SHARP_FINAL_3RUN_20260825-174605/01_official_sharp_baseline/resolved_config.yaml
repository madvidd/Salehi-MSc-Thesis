seed: 2333
tag: ${model.tag}-${datamodule.tag}
output_dir: /home/server00/M/Results/SHARP_FINAL_3RUN_20260825-174605/01_official_sharp_baseline/run
gpus: 4
batch_size: 8
epochs: 80
checkpoint: null
submit: null
callbacks:
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: ${output_dir}/checkpoints
  filename: epoch_{epoch}-minADE6_{minADE6}
  monitor: minADE6
  mode: min
  save_top_k: 10
  save_last: true
  every_n_epochs: 1
  auto_insert_metric_name: false
- _target_: pytorch_lightning.callbacks.RichModelSummary
  max_depth: 1
- _target_: pytorch_lightning.callbacks.TQDMProgressBar
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: epoch
- _target_: src.utils.metrics_history_callback.MetricsHistoryCallback
  output_path: ${output_dir}/metrics_history.jsonl
trainer:
  max_epochs: ${epochs}
  accelerator: gpu
  precision: 32-true
  devices: 4
  strategy: ddp_find_unused_parameters_false
  gradient_clip_val: 5
  gradient_clip_algorithm: norm
  sync_batchnorm: true
  default_root_dir: ${output_dir}
datamodule:
  tag: av2
  pl_module:
    _target_: src.datamodules.av2_datamodule.Av2DataModule
    data_root: /home/server00/M/Datasets/AV2/sharp_processed
    train_batch_size: ${batch_size}
    test_batch_size: ${batch_size}
    shuffle: true
    num_workers: 4
    pin_memory: true
    dataset:
      num_historical_steps: 10
      split_points:
      - 10
      - 20
      - 30
      - 40
      - 50
      radius: 150.0
      ma: false
      num_future_steps: 100
model:
  tag: Sharp
  pl_module:
    _target_: src.model.pl_modules.StreamLightningModule
    num_grad_frame: 10
    model:
      _target_: src.model.sharp.Sharp
      embed_dim: 128
      future_steps: 100
      encoder_depth: 4
      num_heads: 8
      mlp_ratio: 4.0
      qkv_bias: false
      drop_path: 0.2
      use_stream_encoder: true
      use_stream_decoder: true
      use_target_context: true
      dual: true
      biased_interaction: true
      dm: av2
      k: 6
    optim:
      lr: 0.0001
      weight_decay: 0.01
      min_lr: 1.0e-05
      epochs: ${epochs}
      warmup_ratio: 0.1625
